<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;touch-action:manipulation}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#camera{position:fixed;width:2px;height:2px;left:-10px;top:-10px;opacity:.001;pointer-events:none}
#character{position:fixed;width:2px;height:2px;left:-10px;top:-10px;opacity:.001;pointer-events:none}
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<video id="character" src="./lv_0_202610240924464.mp4?v=5.4.0" playsinline preload="auto" loop crossorigin="anonymous"></video>
<canvas id="screen"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d',{alpha:false});
const camera=document.getElementById('camera'),character=document.getElementById('character');
let stream=null,active=false,starting=false,lastW=0,lastH=0,startTime=0,entryDone=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fit(){
 const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 if(w!==lastW||h!==lastH){
  lastW=w;lastH=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 }
}
function drawCover(v,w,h){
 const vw=v.videoWidth||w,vh=v.videoHeight||h,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s;
 ctx.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh);
}
function drawKeyed(w,h,elapsed){
 if(character.readyState<2||!character.videoWidth)return;
 const vw=character.videoWidth,vh=character.videoHeight;
 // 1.32x of the original v5.2 size to ensure the character is visibly larger.
 const finalW=Math.min(w*.88,h*1.08)*1.32;
 let progress=clamp(elapsed/2,0,1);
 const ease=progress*progress*(3-2*progress);
 const scale=.72+.28*ease;
 const dw=finalW*scale,dh=dw*vh/vw;
 // Begin fully outside the left edge, then glide into the exact center over two seconds.
 const x=(-dw/2-8)+(w/2+dw/2+8)*ease;
 if(!drawKeyed.tmp){
  drawKeyed.tmp=document.createElement('canvas');
  drawKeyed.tctx=drawKeyed.tmp.getContext('2d',{willReadFrequently:true});
 }
 const tmp=drawKeyed.tmp,tctx=drawKeyed.tctx;
 if(tmp.width!==vw||tmp.height!==vh){tmp.width=vw;tmp.height=vh}
 tctx.drawImage(character,0,0,vw,vh);
 let image;
 try{image=tctx.getImageData(0,0,vw,vh)}catch(e){ctx.drawImage(character,x-dw/2,(h-dh)/2,dw,dh);return}
 const d=image.data;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],dominance=g-Math.max(r,b);
  const green=Math.max(0,Math.min(1,(dominance-14)/68))*Math.max(0,Math.min(1,(g-50)/100));
  if(green>.84)d[i+3]=0;
  else if(green>.08)d[i+3]=Math.round(d[i+3]*(1-green));
  if(d[i+3]>0&&dominance>8){
   d[i+1]=Math.min(g,Math.max(r,b)+Math.round((g-Math.max(r,b))*(1-green)*.18));
  }
 }
 tctx.putImageData(image,0,0);
 ctx.drawImage(tmp,x-dw/2,(h-dh)/2,dw,dh);
}
function render(){
 fit();const w=innerWidth,h=innerHeight;
 if(camera.readyState>=2)drawCover(camera,w,h);
 else {ctx.fillStyle='#000';ctx.fillRect(0,0,w,h)}
 if(active)drawKeyed(w,h,(performance.now()-startTime)/1000);
 requestAnimationFrame(render);
}
async function start(){
 if(starting||active)return;
 starting=true;
 try{
  // Invoke play directly from the user's first touch so mobile browsers allow its audio.
  character.loop=true;character.muted=false;character.volume=1;character.currentTime=0;
  const mediaPlay=character.play();
  if(!stream){
   const cameraPromise=navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
    audio:false
   });
   stream=await cameraPromise;
   camera.srcObject=stream;
   await camera.play();
  }
  await mediaPlay;
  startTime=performance.now();active=true;entryDone=true;
 }catch(e){
  // Keep the interface entirely blank as requested. Another tap retries permissions/playback.
  active=false;
 }finally{starting=false}
}
document.addEventListener('pointerdown',()=>{if(!active)start()},{passive:true});
document.addEventListener('keydown',()=>{if(!active)start()});
window.addEventListener('resize',fit);
character.addEventListener('ended',()=>{ // Defensive loop fallback for browsers that ignore the loop property.
 if(active){try{character.currentTime=0;character.play()}catch(e){}}
});
fit();render();
// Try to open the camera automatically; if the browser blocks audio, the first tap starts it.
start();
})();
</script>
</body>
</html>
