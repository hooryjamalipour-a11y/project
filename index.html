<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;touch-action:manipulation}
#camera,#character{display:none}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<video id="character" src="./lv_0_202610240924464.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
<audio id="voice" src="./rostam-voice.mp3" preload="auto"></audio>
<canvas id="screen"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d',{alpha:false});
const camera=document.getElementById('camera'),character=document.getElementById('character'),voice=document.getElementById('voice');
let stream=null,raf=0,runStart=0,active=false,starting=false,done=false,lastW=0,lastH=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fit(){
 const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 if(w!==lastW||h!==lastH){lastW=w;lastH=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
}
function cover(v,w,h){
 const vw=v.videoWidth||w,vh=v.videoHeight||h,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s;
 ctx.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh);
}
function drawCharacter(w,h,t){
 if(character.readyState<2||!character.videoWidth||t>=41)return;
 let k;
 if(t<2){let x=clamp(t/2,0,1);k=.25+.75*(x*x*(3-2*x))}
 else if(t<39)k=1;
 else k=1-clamp((t-39)/2,0,1);
 const vw=character.videoWidth,vh=character.videoHeight;
 const dw=Math.min(w*.88,h*1.08)*k,dh=dw*vh/vw;
 if(!drawCharacter.tmp){drawCharacter.tmp=document.createElement('canvas');drawCharacter.tctx=drawCharacter.tmp.getContext('2d',{willReadFrequently:true})}
 const tmp=drawCharacter.tmp,tctx=drawCharacter.tctx;
 if(tmp.width!==vw||tmp.height!==vh){tmp.width=vw;tmp.height=vh}
 tctx.drawImage(character,0,0,vw,vh);
 let image;
 try{image=tctx.getImageData(0,0,vw,vh)}catch(e){ctx.drawImage(character,(w-dw)/2,(h-dh)/2,dw,dh);return}
 const d=image.data;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],dom=g-Math.max(r,b);
  const green=Math.max(0,Math.min(1,(dom-16)/70))*Math.max(0,Math.min(1,(g-55)/100));
  if(green>.86)d[i+3]=0;
  else if(green>.10)d[i+3]=Math.round(d[i+3]*(1-green));
  if(d[i+3]>0&&dom>10)d[i+1]=Math.min(g,Math.max(r,b)+Math.round((g-Math.max(r,b))*(1-green)*.2));
 }
 tctx.putImageData(image,0,0);
 ctx.drawImage(tmp,(w-dw)/2,(h-dh)/2,dw,dh);
}
function loop(){
 fit();const w=innerWidth,h=innerHeight;
 if(camera.readyState>=2)cover(camera,w,h);else{ctx.fillStyle='#000';ctx.fillRect(0,0,w,h)}
 if(active){
  const elapsed=(performance.now()-runStart)/1000;
  drawCharacter(w,h,elapsed);
  if(elapsed>=41){active=false;done=true;character.pause();voice.pause()}
 }
 raf=requestAnimationFrame(loop);
}
async function start(){
 if(starting||active)return;
 starting=true;
 try{
  if(!stream){
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
   camera.srcObject=stream;
   await camera.play();
  }
  character.pause();character.currentTime=0;
  await character.play();
  voice.pause();voice.currentTime=0;
  try{await voice.play()}catch(e){}
  runStart=performance.now();active=true;done=false;
 }catch(e){
  // No visible UI by design. A tap retries after the user grants permissions.
  starting=false;return;
 }
 starting=false;
}
document.addEventListener('pointerdown',()=>{if(!active)start()},{passive:true});
document.addEventListener('keydown',()=>{if(!active)start()});
window.addEventListener('resize',fit);
character.addEventListener('ended',()=>{});
fit();loop();
// Ask for the camera immediately on page load; tap anywhere starts media if autoplay is blocked.
start();
})();
</script>
</body>
</html>
