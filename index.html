<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{position:fixed;inset:0;touch-action:manipulation}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
video{position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:.001;pointer-events:none}
</style>
</head>
<body>
<video id="camera" playsinline muted autoplay></video>
<video id="character" src="./lv_0_202610240924464.mp4?v=5.5.0" playsinline preload="auto" loop></video>
<canvas id="screen"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d',{alpha:false});
const camera=document.getElementById('camera');
const character=document.getElementById('character');
let stream=null,active=false,starting=false,retryQueued=false;
let lastW=0,lastH=0,startTime=0,lastFrameTime=0;
let keyedCanvas=null,keyedCtx=null,smallCanvas=null,smallCtx=null;
let crop={x:0,y:0,w:0,h:0}, cropReady=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fit(){
 const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
 if(w!==lastW||h!==lastH){
  lastW=w;lastH=h;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
 }
}
function drawCover(v,w,h){
 const vw=v.videoWidth||w,vh=v.videoHeight||h;
 const scale=Math.max(w/vw,h/vh),dw=vw*scale,dh=vh*scale;
 ctx.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh);
}
function ensureBuffers(vw,vh){
 if(!keyedCanvas){keyedCanvas=document.createElement('canvas');keyedCtx=keyedCanvas.getContext('2d',{willReadFrequently:true})}
 if(keyedCanvas.width!==vw||keyedCanvas.height!==vh){keyedCanvas.width=vw;keyedCanvas.height=vh;cropReady=false}
 // Do chroma work at half resolution to avoid freezing mid-range phones.
 const sw=Math.max(1,Math.floor(vw/2)),sh=Math.max(1,Math.floor(vh/2));
 if(!smallCanvas){smallCanvas=document.createElement('canvas');smallCtx=smallCanvas.getContext('2d',{willReadFrequently:true})}
 if(smallCanvas.width!==sw||smallCanvas.height!==sh){smallCanvas.width=sw;smallCanvas.height=sh;cropReady=false}
 return {sw,sh};
}
function keyFrame(vw,vh){
 const {sw,sh}=ensureBuffers(vw,vh);
 smallCtx.clearRect(0,0,sw,sh);
 smallCtx.drawImage(character,0,0,sw,sh);
 let image;
 try{image=smallCtx.getImageData(0,0,sw,sh)}catch(e){return false}
 const d=image.data;
 let minX=sw,minY=sh,maxX=-1,maxY=-1;
 for(let y=0;y<sh;y++){
  for(let x=0;x<sw;x++){
   const i=(y*sw+x)*4,r=d[i],g=d[i+1],b=d[i+2];
   const dom=g-Math.max(r,b);
   const green=Math.max(0,Math.min(1,(dom-17)/64))*Math.max(0,Math.min(1,(g-48)/105));
   let a=255;
   if(green>.82)a=0;
   else if(green>.10)a=Math.round(255*(1-green));
   d[i+3]=a;
   if(a>28){if(x<minX)minX=x;if(y<minY)minY=y;if(x>maxX)maxX=x;if(y>maxY)maxY=y}
   if(a>0&&dom>8)d[i+1]=Math.min(g,Math.max(r,b)+Math.round((g-Math.max(r,b))*(1-green)*.16));
  }
 }
 smallCtx.putImageData(image,0,0);
 // Upscale the keyed frame to the original video dimensions.
 keyedCtx.clearRect(0,0,vw,vh);
 keyedCtx.imageSmoothingEnabled=true;
 keyedCtx.imageSmoothingQuality='high';
 keyedCtx.drawImage(smallCanvas,0,0,vw,vh);
 if(maxX>=minX&&maxY>=minY){
  // Add a little breathing room around the detected subject to avoid clipping feathers/flag.
  const padX=Math.round((maxX-minX+1)*.045),padY=Math.round((maxY-minY+1)*.045);
  const bx=Math.max(0,minX-padX),by=Math.max(0,minY-padY);
  const ex=Math.min(sw,maxX+1+padX),ey=Math.min(sh,maxY+1+padY);
  crop={x:bx/sw*vw,y:by/sh*vh,w:(ex-bx)/sw*vw,h:(ey-by)/sh*vh};
  cropReady=true;
 }
 return true;
}
function drawCharacter(w,h,elapsed){
 if(character.readyState<2||!character.videoWidth||!character.videoHeight)return;
 const now=performance.now();
 // Process each new video frame, not every display refresh.
 if(!character.paused && now-lastFrameTime>30){
  keyFrame(character.videoWidth,character.videoHeight);
  lastFrameTime=now;
 }
 if(!cropReady)return;
 const vw=character.videoWidth,vh=character.videoHeight;
 // Visible subject is intentionally larger than previous builds; fit the cut-out itself, not the full green rectangle.
 const targetW=Math.min(w*.94,h*.78);
 const scale=targetW/crop.w;
 const dw=crop.w*scale,dh=crop.h*scale;
 // Enter from completely beyond the left edge over 2 seconds, then stay centered.
 const p=clamp(elapsed/2,0,1),ease=p*p*(3-2*p);
 const x=(-dw/2-12)+(w/2+dw/2+12)*ease;
 const y=(h-dh)/2;
 ctx.drawImage(keyedCanvas,crop.x,crop.y,crop.w,crop.h,x-dw/2,y,dw,dh);
}
function render(){
 fit();
 const w=innerWidth,h=innerHeight;
 if(camera.readyState>=2)drawCover(camera,w,h);
 else {ctx.fillStyle='#000';ctx.fillRect(0,0,w,h)}
 if(active)drawCharacter(w,h,(performance.now()-startTime)/1000);
 requestAnimationFrame(render);
}
async function start(){
 if(starting||active){if(starting)retryQueued=true;return}
 starting=true;
 try{
  // Call video.play immediately, before awaiting camera permission, so a user's tap counts as activation.
  character.loop=true;
  character.muted=false;
  character.volume=1;
  character.playsInline=true;
  character.currentTime=0;
  const videoPromise=character.play();
  if(!stream){
   const s=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}
   });
   stream=s;
   camera.srcObject=stream;
   await camera.play();
  }
  await videoPromise;
  startTime=performance.now();
  lastFrameTime=0;
  active=true;
 }catch(e){
  active=false;
  // Keep the screen free of text as requested; a later tap retries.
 }finally{
  starting=false;
  if(retryQueued&&!active){retryQueued=false;start()}
 }
}
character.addEventListener('ended',()=>{
 if(active){
  character.currentTime=0;
  character.play().catch(()=>{});
 }
});
character.addEventListener('loadedmetadata',()=>{cropReady=false;lastFrameTime=0});
document.addEventListener('pointerdown',()=>{if(!active)start()},{passive:true});
document.addEventListener('keydown',()=>{if(!active)start()});
window.addEventListener('resize',fit);
window.addEventListener('pageshow',()=>{if(!active)start()});
fit();
render();
// Attempt direct camera/video startup. If browser policy blocks it, touching anywhere retries.
start();
})();
</script>
</body>
</html>
